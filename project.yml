# XcodeGen spec — generates the Xcode project from the source folders.
#
# On your Mac:
#   brew install xcodegen          # once
#   cd idrees-big-boy-app
#   xcodegen generate              # creates IdreesBigBoyApp.xcodeproj
#   open IdreesBigBoyApp.xcodeproj
#
# Then set your Team under Signing for both targets and press Run.
# Replace YOURTEAM/bundle IDs below with your own before generating, or set
# them in Xcode after. This is a starting point — tweak in Xcode as needed.

name: IdreesBigBoyApp

options:
  bundleIdPrefix: com.waseem.idreesbigboy
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.4.0"

targets:
  # ---- iPhone parent app (the main app the watch app is embedded in) ----
  IdreesBigBoyApp:
    type: application
    platform: iOS
    sources:
      - ParentApp
      - Shared
    dependencies:
      - target: IdreesWatch
        embed: true
      - package: Adhan          # shared model references Adhan types indirectly; safe to include
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waseem.idreesbigboy
        INFOPLIST_KEY_CFBundleDisplayName: Idrees Big Boy App
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: ParentApp/ParentApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        # DEVELOPMENT_TEAM: YOURTEAMID   # set this in Xcode or here

  # ---- Apple Watch app ----
  IdreesWatch:
    type: application
    platform: watchOS
    sources:
      - NoorWatch
      - Shared
    dependencies:
      - package: Adhan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waseem.idreesbigboy.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Idrees Big Boy App
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.waseem.idreesbigboy
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used to calculate prayer times and the Qibla, and to show %@ in Find My."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used to record voice notes."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: NoorWatch/NoorWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # DEVELOPMENT_TEAM: YOURTEAMID
