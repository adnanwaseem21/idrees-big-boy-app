# Builds on a rented Mac and uploads to App Store Connect as a normal App Store build (not "TestFlight
# Internal Only", which App Review can never use). No secrets in here: signing uses Apple's cloud signing
# with the App Store Connect key already stored in Codemagic ("saucy-app-store").
workflows:
  app-store:
    name: Idrees Big Boy App - App Store build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: saucy-app-store
    environment:
      xcode: latest
      vars:
        APP_ID: "6824039842"
    scripts:
      - name: App Store Connect key for signing
        script: |
          set -e
          echo "available: $(env | grep -o '^APP_STORE_CONNECT_[A-Z_]*' | tr '\n' ' ')"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/asc.p8"
          echo "ASC_AUTH=-allowProvisioningUpdates -authenticationKeyPath $HOME/asc.p8 -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID" >> "$CM_ENV"
      - name: Build number = last upload + 1
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || echo 31)
          echo "BUILD_NO=$((${LAST:-31} + 1))" >> "$CM_ENV"
      - name: Archive
        script: |
          xcodebuild -list -project IdreesBigBoyApp.xcodeproj
          xcodebuild -project IdreesBigBoyApp.xcodeproj -scheme IdreesBigBoyApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/IdreesBigBoyApp.xcarchive archive \
            CURRENT_PROJECT_VERSION=$BUILD_NO $ASC_AUTH
      - name: Sign and upload to App Store Connect
        script: |
          xcodebuild -exportArchive -archivePath build/IdreesBigBoyApp.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export $ASC_AUTH
    artifacts:
      - build/export/*.ipa
      - /tmp/xcodebuild_logs/*.log
